# docker compose up -d --build   →   http://localhost:${PHOTOPRINT_PORT}
services:
  photoprint:
    build: .
    image: photoprint:latest
    environment:
      BRIDGE_URL: ${BRIDGE_URL:-http://host.docker.internal:8787}
    ports:
      - "${PHOTOPRINT_PORT:-8080}:80"
    extra_hosts:
      # Lets the container reach a bridge running on the Docker host (Linux).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
